name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anki
          POSTGRES_PASSWORD: anki
          POSTGRES_DB: anki_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anki" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run cards:check
      - run: npm test
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://anki:anki@localhost:5432/anki_test
      - run: npm run build
